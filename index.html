<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple Music · Me vo' a comer el mundo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#8fd8ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.card{width:min(680px,100%);margin:auto;padding:28px}
.top{display:flex;gap:18px;align-items:center}
.art{width:92px;height:92px;border-radius:16px;object-fit:cover;box-shadow:0 12px 30px #0008}
h1{font-size:21px;margin:0;color:#8fd8ff;font-weight:700}
button,.open,.play{border:0;border-radius:999px;cursor:pointer;background:#8fd8ff;color:#111;font:inherit}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <img class="art" src="cover.jpeg" alt="Portada">
    <div><h1>Me vo' a comer el mundo como un bistec</h1></div>
  </div>
</div>
</body>
</html>
